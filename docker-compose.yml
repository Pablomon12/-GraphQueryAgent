services:
  init-fuseki-config:
    image: alpine:3.21
    entrypoint: ["/bin/sh", "/bootstrap/init-fuseki-config.sh"]
    volumes:
      - fuseki-data:/fuseki
      - ./docker/init-fuseki-config.sh:/bootstrap/init-fuseki-config.sh:ro
      - ./docker/fuseki-config.ttl:/bootstrap/fuseki-config.ttl:ro
    restart: "no"

  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      FUSEKI_QUERY_ENDPOINT: http://fuseki:3030/dataset/query
      ONTOLOGY_PATHS: knowledge/ontology,knowledge/data
    depends_on:
      init-fuseki:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge/ontology:/app/knowledge/ontology:ro
      - ./knowledge/data:/app/knowledge/data:ro

  fuseki:
    image: stain/jena-fuseki:5.1.0
    hostname: fuseki
    environment:
      ADMIN_PASSWORD: admin
    depends_on:
      init-fuseki-config:
        condition: service_completed_successfully
    ports:
      - "3030:3030"
    volumes:
      - fuseki-data:/fuseki
    networks:
      default:
        aliases:
          - fuseki

  init-fuseki:
    image: curlimages/curl:8.8.0
    environment:
      FUSEKI_USERNAME: admin
      FUSEKI_PASSWORD: admin
    depends_on:
      fuseki:
        condition: service_started
    entrypoint: ["/bin/sh", "/bootstrap/init-fuseki.sh"]
    volumes:
      - ./docker/init-fuseki.sh:/bootstrap/init-fuseki.sh:ro
      - ./knowledge/ontology:/bootstrap/ontology:ro
      - ./knowledge/data:/bootstrap/data:ro
    restart: "no"

volumes:
  fuseki-data:
