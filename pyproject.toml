[project]
name = "ontology-agent"
version = "0.1.0"
description = "FastAPI backend for ontology-driven SPARQL question answering"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "langgraph>=1.2.0",
    "openai>=1.99.0",
    "pydantic>=2.0.0",
    "pyshacl>=0.31.0",
    "rdflib>=7.6.0",
    "sparqlwrapper>=2.0.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
